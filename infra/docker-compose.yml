# Runs identically on the Mac Studio (arm64) and a small amd64 VPS:
# everything is containerised, config comes from ../.env, data lives in named volumes.
name: fairline

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fairline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fairline}
    ports: ["127.0.0.1:${DB_HOST_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fairline}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]

  migrate:
    build: {context: .., dockerfile: infra/Dockerfile.py}
    env_file: ../.env
    environment: &appenv
      DATABASE_URL: postgresql://${POSTGRES_USER:-fairline}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fairline}
      FAIRLINE_ROOT: /app
    command: ["fairline", "db", "migrate"]
    depends_on: {db: {condition: service_healthy}}

  api:
    build: {context: .., dockerfile: infra/Dockerfile.py}
    restart: unless-stopped
    env_file: ../.env
    environment: *appenv
    command: ["uvicorn", "fairline.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on: {migrate: {condition: service_completed_successfully}}

  dagster-webserver:
    build: {context: .., dockerfile: infra/Dockerfile.py}
    restart: unless-stopped
    env_file: ../.env
    environment: *appenv
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/app/infra/dagster/workspace.yaml"]
    ports: ["127.0.0.1:3000:3000"]
    volumes: [dagster_home:/dagster_home, rawdata:/app/data]
    depends_on: {migrate: {condition: service_completed_successfully}}

  dagster-daemon:
    build: {context: .., dockerfile: infra/Dockerfile.py}
    restart: unless-stopped
    env_file: ../.env
    environment: *appenv
    command: ["dagster-daemon", "run", "-w", "/app/infra/dagster/workspace.yaml"]
    volumes: [dagster_home:/dagster_home, rawdata:/app/data]
    depends_on: {migrate: {condition: service_completed_successfully}}

volumes:
  pgdata:
  redisdata:
  dagster_home:
  rawdata:
