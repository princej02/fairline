name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: timescale/timescaledb:2.17.2-pg16    # keep in step with infra/docker-compose.yml
        env:
          POSTGRES_USER: fairline
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fairline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fairline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FAIRLINE_TEST_DATABASE_URL: postgresql://fairline:ci-only-password@localhost:5432/fairline_test
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: py/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Tests (unit + TimescaleDB integration)
        run: uv run pytest -q -rs

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.py
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
