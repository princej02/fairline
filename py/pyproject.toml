[project]
name = "fairline"
version = "0.1.0"
description = "Fairline: sports betting analytics and decision support (never places bets)"
requires-python = ">=3.13"
dependencies = [
  "polars>=1.20",
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "dagster>=1.9",
  "dagster-webserver>=1.9",
  "scipy>=1.14",
  "numpy>=2.0",
  "pymc>=5.20",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.scripts]
fairline = "fairline.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fairline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a running TimescaleDB (set FAIRLINE_TEST_DATABASE_URL)",
  "slow: runs MCMC (a few seconds)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # ruff format enforces line length for code; long SQL strings are fine

[tool.uv]
# uv-managed CPython bundles its own OpenSSL; avoids breakage from system/pyenv builds.
python-preference = "only-managed"
